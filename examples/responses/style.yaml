# Copied from config/style.yaml — see that file for full annotation.
#
# ──────────────────────────────────────────────────────────────────────────────
# umfrage — Excel Style Configuration
# ──────────────────────────────────────────────────────────────────────────────
#
# This file controls the visual appearance of generated questionnaire and
# result Excel files. All color values are 6-digit hex codes WITHOUT a '#'.
#
# Pass this file to any command with: --style config/style.yaml
# If omitted, umfrage looks for config/style.yaml automatically, then falls
# back to built-in defaults.
# ──────────────────────────────────────────────────────────────────────────────

# ── Title / header row (Row 1 of the questionnaire, Row 1 of the result) ─────
header:
  background_color: "1F4E79"   # Dark navy blue
  font_color: "FFFFFF"          # White text
  font_size: 14
  bold: true
  italic: false

# ── Section header rows (colored band above each group of questions) ──────────
section_header:
  background_color: "2E75B6"   # Medium blue
  font_color: "FFFFFF"
  font_size: 11
  bold: true
  italic: false

# ── Question rows (alternating row colors for readability) ────────────────────
question_row:
  background_color: "D6E4F0"   # Light blue
  alternate_color: "EEF4FA"    # Slightly lighter blue for odd rows
  font_color: "000000"
  font_size: 10
  bold: false
  italic: false

# ── Answer input cells (editable; shown with a heavier border) ────────────────
answer_cell:
  background_color: "FFFFFF"   # White background to emphasize editability
  font_color: "000000"
  font_size: 10
  bold: false
  italic: false

# ── "RESPONDENT INFORMATION" label row ───────────────────────────────────────
respondent_header:
  background_color: "375623"   # Dark green
  font_color: "FFFFFF"
  font_size: 11
  bold: true
  italic: false

# ── Result spreadsheet column headers ────────────────────────────────────────
result_header:
  background_color: "375623"   # Dark green (matches respondent_header)
  font_color: "FFFFFF"
  font_size: 10
  bold: true
  italic: false

# ── Warning highlight for missing / invalid answers in the result file ────────
# Applied as the background of cells where a required question was left blank.
warning_color: "FFCCCC"        # Soft red / salmon

# ── Marker text for force-included files with missing answers ─────────────────
# When 'umfrage collect' prompts you to include a file that failed validation,
# any answer cells that are still empty are filled with this placeholder text
# and highlighted in warning_color so they stand out in the result spreadsheet.
missing_answer_marker: "XXXXX"

# ── Column widths (in character units) for the questionnaire sheet ────────────
column_widths:
  question_id: 10              # Column A: question ID
  question_text: 55            # Column B: question text
  answer: 20                   # Column C: answer input cell
  comment: 35                  # Column D: scale labels / comments

# ── Worksheet protection password ────────────────────────────────────────────
# When set, the generated questionnaire is protected with this password.
# Respondents can still unprotect the sheet in Excel/LibreOffice if needed —
# the protection is a guidance measure, not strict enforcement.
# Set to null (or omit entirely) for password-free protection.
protection_password: null
# protection_password: "survey2024"   # Uncomment and change to enable

# ── Footer row on the questionnaire sheet ────────────────────────────────────
# When true (default), a small footer row is appended after the last question.
# It shows the tool name ("Generated with umfrage" / "Erzeugt mit umfrage")
# and links to https://github.com/scinnod/umfrage.
# Set to false to suppress the footer entirely (e.g. for white-label output).
show_footer: true
